<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 300px;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .status {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
        }
        
        .status.active {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.inactive {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.no-chat {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        
        button {
            width: 100%;
            padding: 10px;
            background-color: #007cba;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        
        button:hover {
            background-color: #005a8b;
        }
        
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        
        .toggle-button.active {
            background-color: #28a745;
        }
        
        .toggle-button.active:hover {
            background-color: #218838;
        }
        
        .toggle-button.inactive {
            background-color: #dc3545;
        }
        
        .toggle-button.inactive:hover {
            background-color: #c82333;
        }
        
        .info {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <h3>XLink Chat OBS Bridge</h3>
    </div>
    
    <div id="status" class="status">
        Verificando estado...
    </div>
    
    <div class="control-group">
        <label for="serverUrl">URL del servidor OBS:</label>
        <input type="text" id="serverUrl" placeholder="http://localhost:5000">
    </div>
    
    <button id="testButton">
        Probar conexión
    </button>
    
    <div class="info">
        XLink Chat OBS Bridge se activa automáticamente al detectar un chat de XLink Kai. 
        Asegúrate de que el plugin de OBS esté ejecutándose en el puerto especificado.
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
